# Every push and pull request: content and copy rules, both rules engines on the shared
# fixtures, the API tests, the PWA build and a headless-Chrome walk through it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-and-web:
    name: Content, JS engine, PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Content validation, copy lint (10 languages), locale parity, bundle freshness, JS engine fixtures.
      - run: npm run check
      # The source re-check and the ML service skeleton (standard library only).
      - run: python3 -I ingest/test_recheck.py
      - run: python3 -I ml/test_service.py
      - run: npm run setup
      # Builds frontend/dist, then drives it in headless Chrome (English, then Tamil for long strings).
      # Includes axe on every page: a serious or critical accessibility issue fails the build.
      - run: npm run smoke
      # DESIGN.md §10: sizes of what a first visit downloads.
      - run: npm run check:budget
      # Lighthouse on the built site (accessibility must stay at 100).
      - run: node tools/lighthouse.mjs
      - run: node tools/smoke-web.mjs --lang ta --scheme light

  backend:
    name: Java engine and API
    runs-on: ubuntu-latest
    # PostgresTest runs every migration here and checks that the audit logs are insert-only.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: jansathi
          POSTGRES_USER: jansathi
          POSTGRES_PASSWORD: jansathi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jansathi -d jansathi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - run: POSTGRES_APP_PASSWORD=app POSTGRES_USER=jansathi POSTGRES_DB=jansathi PGHOST=localhost PGPASSWORD=jansathi sh deploy/postgres/10-app-role.sh
      # The Java engine runs the same rules/ fixtures as the JS engine, so the two stay identical.
      - run: ./gradlew --no-daemon test
        working-directory: backend
        env:
          JANSATHI_TEST_PG_URL: jdbc:postgresql://localhost:5432/jansathi
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/build/test-results/test

  image:
    name: Docker image
    if: github.event_name == 'push'
    needs: [content-and-web, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jansathi:ci .
