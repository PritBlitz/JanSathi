# Every push and pull request: content and copy rules, both rules engines on the shared
# fixtures, the API tests, the PWA build and a headless-Chrome walk through it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-and-web:
    name: Content, JS engine, PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Content validation, copy lint (10 languages), locale parity, bundle freshness, JS engine fixtures.
      - run: npm run check
      - run: npm run setup
      # Builds frontend/dist, then drives it in headless Chrome (English, then Tamil for long strings).
      - run: npm run smoke
      - run: node tools/smoke-web.mjs --lang ta --scheme light

  backend:
    name: Java engine and API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      # The Java engine runs the same rules/ fixtures as the JS engine, so the two stay identical.
      - run: ./gradlew --no-daemon test
        working-directory: backend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/build/test-results/test

  image:
    name: Docker image
    if: github.event_name == 'push'
    needs: [content-and-web, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jansathi:ci .
