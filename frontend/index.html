<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JanSathi: government schemes in your language</title>
  <meta name="description" content="Find government schemes you may qualify for, in your language. Every answer links to an official source.">
  <meta name="theme-color" content="#F7F4ED" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0D0B1C" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin>

<body>
  <div id="root">
    <!-- Boot screen: the brand word in solid ink, at the size and place of the hero word (DESIGN §10: the
         LCP element renders before the app, its locale and its data arrive). No blank page on slow networks.
         It is a language-neutral brand name, not UI copy. Replaced when React mounts. -->
    <div id="boot" class="boot" aria-hidden="true"><div class="hero-word-wrap"><p class="hero-word"><span>JanSathi</span></p></div><span class="boot-bar"></span></div>
  </div>
  <noscript><p style="padding:24px;font:18px/1.5 system-ui">JanSathi needs JavaScript to check schemes. जनसाथी को चलाने के लिए JavaScript चालू करें।</p></noscript>
</body>
